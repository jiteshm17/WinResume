name: build

# Every push and pull request is built and tested.
# Pushing a tag like v0.1.0 also publishes a GitHub release with the downloadable zip.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish (self-contained, single file)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish src/WinResume.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish

      - name: Zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $name = "WinResume-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path publish/WinResume.App.exe -DestinationPath $name
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  $name" | Set-Content "$name.sha256"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "WinResume-${{ github.ref_name }}-win-x64.zip"
          gh release create "${{ github.ref_name }}" $zip "$zip.sha256" `
            --title "WinResume ${{ github.ref_name }}" `
            --prerelease `
            --notes-file RELEASE_NOTES.md
